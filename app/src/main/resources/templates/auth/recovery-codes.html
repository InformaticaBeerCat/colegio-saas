<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Códigos de recuperación')}"></head>
<body>
<main id="contenido" class="auth-shell">
    <section class="card auth-card" aria-labelledby="titulo">
        <h1 id="titulo">Guarda tus códigos de recuperación</h1>
        <div class="alert alert-ok" role="status">Verificación en dos pasos activada.</div>
        <p>Si pierdes el teléfono, cada uno de estos códigos te deja ingresar <strong>una vez</strong>.
            Guárdalos en un lugar seguro: no los volveremos a mostrar.</p>
        <ol class="codes">
            <li th:each="code : ${codes}" th:text="${code}">ABCDE-FGHJK</li>
        </ol>
        <p><a class="btn" th:href="@{/admin}">Ya los guardé, ir al panel</a></p>
    </section>
</main>
</body>
</html>
