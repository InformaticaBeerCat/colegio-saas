<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Recuperar contraseña')}"></head>
<body>
<main id="contenido" class="auth-shell">
    <section class="card auth-card" aria-labelledby="titulo">
        <h1 id="titulo">Recuperar contraseña</h1>
        <p>Te enviaremos un enlace para elegir una contraseña nueva.</p>
        <form th:action="@{/admin/password/forgot}" method="post">
            <div class="field">
                <label for="email">Correo de tu cuenta</label>
                <input id="email" name="email" type="email" autocomplete="email" required autofocus>
            </div>
            <button type="submit" class="btn">Enviar enlace</button>
        </form>
        <p><a th:href="@{/admin/login}">Volver al ingreso</a></p>
    </section>
</main>
</body>
</html>
