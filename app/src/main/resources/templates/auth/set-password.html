<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${title})}"></head>
<body>
<main id="contenido" class="auth-shell">
    <section class="card auth-card" aria-labelledby="titulo">
        <h1 id="titulo" th:text="${title}">Nueva contraseña</h1>
        <div class="alert alert-problem" role="alert" th:if="${problem}" th:text="${problem}"></div>
        <form th:action="@{${action}}" method="post">
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12"
                       aria-describedby="password-hint">
                <span id="password-hint" class="hint">Al menos 12 caracteres. Una frase que recuerdes funciona bien.</span>
            </div>
            <div class="field">
                <label for="passwordConfirmation">Repite la contraseña</label>
                <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn">Guardar</button>
        </form>
    </section>
</main>
</body>
</html>
