<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- El panel nunca se indexa (SEO-03). -->
    <meta name="robots" content="noindex, nofollow">
    <title th:text="|${title} · ${schoolName}|">Panel</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header th:fragment="admin-header" class="topbar">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="topbar__inner">
        <a class="brand" th:href="@{/admin}" th:text="${schoolName}">Colegio</a>
        <nav aria-label="Panel de administración">
            <a th:href="@{/admin}">Inicio</a>
            <a sec:authorize="hasAuthority('NEWS_EDIT')" th:href="@{/admin/news}">Noticias</a>
            <a sec:authorize="hasAuthority('CALENDAR')" th:href="@{/admin/calendar}">Calendario</a>
            <a sec:authorize="hasAuthority('PAGES')" th:href="@{/admin/pages}">Páginas</a>
            <a sec:authorize="hasAnyAuthority('MEDIA_UPLOAD', 'MEDIA_REVIEW')" th:href="@{/admin/media}">Medios</a>
            <a sec:authorize="hasAuthority('USERS')" th:href="@{/admin/users}">Usuarios</a>
            <a sec:authorize="hasAuthority('AUDIT_LOG')" th:href="@{/admin/audit}">Auditoría</a>
            <a th:href="@{/admin/profile}">Mi cuenta</a>
            <a th:href="@{/}">Ver sitio</a>
        </nav>
        <form th:action="@{/admin/logout}" method="post" class="inline">
            <button type="submit" class="link">Cerrar sesión</button>
        </form>
    </div>
</header>

<!-- Avisos que dejan los controladores con RedirectAttributes.addFlashAttribute. -->
<div th:fragment="flash" th:remove="tag">
    <div class="alert alert-ok" role="status" th:if="${notice}" th:text="${notice}"></div>
    <div class="alert alert-problem" role="alert" th:if="${problem}" th:text="${problem}"></div>
</div>

<!-- Botón para salir desde las pantallas del segundo factor. -->
<form th:fragment="cancel-login" th:action="@{/admin/logout}" method="post">
    <button type="submit" class="link">Cancelar y salir</button>
</form>

</body>
</html>
