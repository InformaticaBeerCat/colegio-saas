<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Mi cuenta')}"></head>
<body>
<header th:replace="~{fragments/layout :: admin-header}"></header>
<main id="contenido" class="container">
    <h1>Mi cuenta</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="cards">
        <section class="card" aria-labelledby="datos">
            <h2 id="datos">Datos</h2>
            <p><strong th:text="${account.name}">Nombre</strong><br><span th:text="${account.email}">correo</span></p>
            <p><span class="badge" th:each="r : ${account.roles}" th:text="${#messages.msg('role.' + r)}">Rol</span></p>
        </section>

        <section class="card" aria-labelledby="mfa">
            <h2 id="mfa">Verificación en dos pasos</h2>
            <div th:if="${account.mfaEnabled}">
                <p><span class="badge badge-ok">Activa</span></p>
                <p class="muted" th:text="|Códigos de recuperación disponibles: ${account.remainingRecoveryCodes()}|"></p>
                <form th:action="@{/admin/mfa/disable}" method="post">
                    <div class="field">
                        <label for="mfaPassword">Tu contraseña, para desactivarla</label>
                        <input id="mfaPassword" name="currentPassword" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-secondary">Desactivar</button>
                </form>
            </div>
            <div th:unless="${account.mfaEnabled}">
                <p>Al ingresar, además de tu contraseña te pediremos un código de tu teléfono.</p>
                <p th:if="${account.mfaRecommended()}" class="alert alert-warn">
                    Tu rol administra el sitio o ve datos de estudiantes: te recomendamos activarla.
                </p>
                <a class="btn" th:href="@{/admin/mfa/enable}">Activar</a>
            </div>
        </section>

        <section class="card" aria-labelledby="clave">
            <h2 id="clave">Cambiar contraseña</h2>
            <form th:action="@{/admin/profile/password}" method="post">
                <div class="field">
                    <label for="currentPassword">Contraseña actual</label>
                    <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
                </div>
                <div class="field">
                    <label for="password">Nueva contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
                    <span class="hint">Al menos 12 caracteres.</span>
                </div>
                <div class="field">
                    <label for="passwordConfirmation">Repite la nueva contraseña</label>
                    <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn">Cambiar contraseña</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
