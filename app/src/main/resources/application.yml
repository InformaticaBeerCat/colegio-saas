# Configuración común a todos los perfiles.
# Sin perfil activo se usa H2 en memoria (modo MySQL): arranca sin instalar nada.
# Para MySQL real: SPRING_PROFILES_ACTIVE=mysql (ver application-mysql.yml).
spring:
  application:
    name: colegio-saas

  datasource:
    url: jdbc:h2:mem:colegio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades calcen con las tablas.
    hibernate:
      ddl-auto: validate
    # Sin "Open Session in View": cada transacción abre su sesión con el colegio correcto.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      # Subida masiva de fotos (MED-03): varias de hasta 15 MB en una sola petición.
      max-request-size: 200MB

  # UX-02: CSS, JS y fuentes con la huella de su contenido en la URL (site-3f2a….css) y caché de un año; al
  # cambiar un archivo cambia su URL, así nadie queda con una versión vieja.
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

# OPS-06: salud para el monitoreo externo. El contenedor se reinicia solo por /actuator/health/liveness;
# el detalle (respaldos, antivirus, licencia) lo ve quien tiene el permiso de plataforma.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: PLATFORM
      probes:
        enabled: true
  info:
    build:
      enabled: true

server:
  # Detrás del proxy HTTPS (Caddy en deploy/compose.yml): esquema e IP real del visitante desde X-Forwarded-*.
  # Solo se confía en proxies de redes internas.
  forward-headers-strategy: native
  # UX-02: HTML, CSS y JS comprimidos.
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,application/xml,image/svg+xml,text/plain,text/calendar
    min-response-size: 1KB
  error:
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # En producción (HTTPS) va en true: la cookie de sesión nunca viaja sin cifrar.
        secure: ${APP_SECURE_COOKIES:false}

# Correo: sin SPRING_MAIL_HOST los correos se escriben en el log. Con el compose de desarrollo:
# SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 (Mailpit en http://localhost:8025).

app:
  storage:
    # local: carpeta del servidor (un volumen persistente en producción). s3: AWS S3 o MinIO (OPS-07).
    type: ${APP_STORAGE_TYPE:local}
    local-dir: ${APP_STORAGE_DIR:./data/files}
    s3:
      endpoint: ${APP_S3_ENDPOINT:}
      region: ${APP_S3_REGION:us-east-1}
      bucket: ${APP_S3_BUCKET:colegio}
      access-key: ${APP_S3_ACCESS_KEY:}
      secret-key: ${APP_S3_SECRET_KEY:}
      path-style: ${APP_S3_PATH_STYLE:true}
  antivirus:
    # Sin host, los archivos solo pasan la revisión de tipo y tamaño (se avisa en el log al arrancar).
    clamd-host: ${APP_CLAMD_HOST:}
    clamd-port: ${APP_CLAMD_PORT:3310}
  privacy:
    # Plazos a validar con la asesoría legal del colegio (Ley 21.719).
    response-days: ${APP_PRIVACY_RESPONSE_DAYS:30}
    incident-hours: ${APP_PRIVACY_INCIDENT_HOURS:72}
    retention-enabled: ${APP_RETENTION_ENABLED:true}
  agenda:
    # Fuente oficial de feriados (AGE-02); {year} se reemplaza por el año.
    holidays-url: ${APP_HOLIDAYS_URL:https://apis.digital.gob.cl/fl/feriados/{year}}
    min-notice: ${APP_AGENDA_MIN_NOTICE:2h}
    horizon-days: ${APP_AGENDA_HORIZON_DAYS:30}
    reminder-lead: 24h
  platform:
    # development | production. En producción la app no arranca con llaves de desarrollo, sin HTTPS o sin licencia.
    environment: ${APP_ENVIRONMENT:development}
    license: ${APP_LICENSE:}
    updates-feed-url: ${APP_UPDATES_FEED_URL:}
    alerts-email: ${APP_ALERTS_EMAIL:}
    backup-status-file: ${APP_BACKUP_STATUS_FILE:}
  analytics:
    # REP-01: conteo propio y anónimo de visitas. Opcional: una herramienta externa (https://…/script.js) que solo
    # se carga a quien acepta la analítica en el banner de cookies.
    enabled: ${APP_ANALYTICS_ENABLED:true}
    script-url: ${APP_ANALYTICS_SCRIPT_URL:}
  forms:
    # Antispam de formularios públicos (COM-08).
    min-fill-time: 3s
    max-per-ip: ${APP_FORMS_MAX_PER_IP:5}
    ip-window: 10m
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${APP_MAIL_FROM:no-responder@localhost}
  security:
    max-failed-logins: 5
    lockout-duration: 15m
    max-failed-logins-per-ip: 20
    ip-window: 15m
    # MFA opcional: cada persona lo activa desde "Mi cuenta". En true se exige a los roles sensibles
    # (Super Admin, administrador del colegio, gestor de consentimientos), como pide USR-02.
    enforce-mfa: ${APP_ENFORCE_MFA:false}
  crypto:
    # Los valores por defecto son SOLO para desarrollo y tests. Cada instalación genera las suyas
    # (openssl rand -base64 32) y las entrega por variable de entorno; la fase 9 impide arrancar en
    # producción con estas.
    field-key: ${APP_FIELD_KEY:uZVrGeLHRbUrhdmF3EycAPb6SvRvwKdsZFCp8d0ZmH4=}
    index-key: ${APP_INDEX_KEY:o8bfT9FdOu0BbSJmCBc15RAXiiNLjGv12HrxTX0NIR8=}
