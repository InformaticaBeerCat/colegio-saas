# Perfil para MySQL 8.4+. Por defecto apunta al MySQL de compose.yaml (puerto 3307).
# Crear la base antes: CREATE DATABASE colegio_saas CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/colegio_saas}
    username: ${DB_USER:colegio}
    password: ${DB_PASSWORD:colegio}
