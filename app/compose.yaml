# Servicios de apoyo para desarrollo: docker compose up -d
# Luego arrancar la app con el perfil mysql.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: colegio_saas
      MYSQL_USER: colegio
      MYSQL_PASSWORD: colegio
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"  # 3307 para no chocar con un MySQL local
    volumes:
      - mysql-data:/var/lib/mysql

  # Captura los correos que envía la app (http://localhost:8025). Se usa desde la fase 7.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Almacenamiento S3 compatible (OPS-07): consola en http://localhost:9001 (minio / minio-secreto).
  # Arrancar la app con APP_STORAGE_TYPE=s3 (ver README).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secreto
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Antivirus para los archivos subidos (SEG-03). Arrancar la app con APP_CLAMD_HOST=localhost.
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

volumes:
  mysql-data:
  minio-data:
