# SEG-02: actualizaciones de dependencias con avisos de seguridad.
version: 2
updates:
  - package-ecosystem: maven
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /app/perf
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/backup
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
